openapi: 3.0.3
info:
  title: HBIMS Cash Collection API
  version: 1.0.0
  description: >-
    Frontend contract for the new Spring Boot cash-collection service. The
    backend owns authorization, counter scope, eligibility, prices, totals,
    payment state, document numbers and printable data.
servers:
  - url: /api/cash-collection
security:
  - sessionCookie: []
paths:
  /bootstrap:
    get:
      summary: Load counter-scoped reference data and dashboard summaries
      operationId: loadBootstrap
      responses:
        "200":
          description: Bootstrap data. Requests and transactions may contain only an initial page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /patients:
    get:
      summary: Search eligible patients in the current hospital and counter scope
      operationId: searchPatients
      parameters:
        - { $ref: "#/components/parameters/PatientSearch" }
        - name: hospital_service_id
          in: query
          schema: { type: string }
        - name: admitted_only
          in: query
          description: Limit the result to patients with a currently open admission.
          schema: { type: boolean }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
        - name: admission_sort
          in: query
          description: Whitelisted sort; the admitted-patient picker uses admitted_on,desc.
          schema: { type: string }
      responses:
        "200":
          description: Matching patients
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Patient" }
        default: { $ref: "#/components/responses/Error" }
  /patients/{cr_num}/tile:
    get:
      summary: Load the compact patient header by CR number
      operationId: getPatientTile
      parameters:
        - name: cr_num
          in: path
          required: true
          description: Sole patient identifier for this lookup.
          schema: { type: string }
      responses:
        "200":
          description: Patient tile data only
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/PatientTile" }
        default: { $ref: "#/components/responses/Error" }
  /requests:
    get:
      summary: List pending requests with server-side filtering and pagination
      operationId: listPendingRequests
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
        - { $ref: "#/components/parameters/RequestSearch" }
        - { $ref: "#/components/parameters/HospitalServiceName" }
        - { $ref: "#/components/parameters/RequestType" }
        - name: department_name
          in: query
          schema: { type: string }
        - name: category_name
          in: query
          schema: { type: string }
        - name: req_date
          in: query
          schema: { type: string, format: date }
        - name: req_sort
          in: query
          description: Whitelisted sort, for example req_date,desc or req_amount,asc.
          schema: { type: string }
      responses:
        "200":
          description: Counter-scoped request page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestPageEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /dashboard/pending-metrics:
    get:
      summary: Aggregate pending requests for the current counter dashboard
      operationId: getPendingRequestMetrics
      parameters:
        - name: pending_date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: category_name
          in: query
          schema: { type: string }
        - name: department_name
          in: query
          schema: { type: string }
        - { $ref: "#/components/parameters/HospitalServiceName" }
        - { $ref: "#/components/parameters/RequestType" }
      responses:
        "200":
          description: Server-side pending request aggregates
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - properties:
                      data:
                        { $ref: "#/components/schemas/PendingRequestMetrics" }
        default: { $ref: "#/components/responses/Error" }
  /dashboard:
    get:
      summary: Load the server-authoritative same-day dashboard read model
      description: >-
        All values are scoped from the authenticated HBIMS hospital, seat and
        counter. Every KPI and breakdown is calculated from the same business
        date and transaction population so totals reconcile. Cash in drawer is
        the unfiltered cash-payment net and is not recalculated by dashboard filters.
      operationId: getDashboard
      parameters:
        - name: dashboard_date
          in: query
          required: true
          schema: { type: string, format: date }
        - name: payment_mode
          in: query
          schema: { type: string }
        - name: transaction_status
          in: query
          schema: { type: string }
        - name: collection_hour
          in: query
          schema: { type: integer, minimum: 0, maximum: 23 }
        - name: category_name
          in: query
          schema: { type: string }
        - name: department_name
          in: query
          description: Display label for the legacy raising department dimension.
          schema: { type: string }
        - { $ref: "#/components/parameters/RequestType" }
      responses:
        "200":
          description: Filtered same-day dashboard snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /requests/{req_no}:
    get:
      summary: Reload authoritative request metadata before collection
      operationId: getRequest
      parameters:
        - name: req_no
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Request detail
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/RequestDetail" }
        default: { $ref: "#/components/responses/Error" }
  /requests/{req_no}/tariff-details:
    get:
      summary: Load OPD/IPD request tariff lines and optional IPD settlement context
      operationId: getRequestTariffDetails
      parameters:
        - name: req_no
          in: path
          required: true
          schema: { type: string }
        - name: req_version
          in: query
          required: false
          description: Opaque request version used for stale-state detection. Omitted only for an initial legacy read whose pending row has no version; the response must return the current version.
          schema: { type: string }
      responses:
        "200":
          description: Tariff details; settlement_context is present only for IPD Final Adjustment
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - properties:
                      data:
                        { $ref: "#/components/schemas/RequestTariffDetails" }
        default: { $ref: "#/components/responses/Error" }
  /tariffs:
    get:
      summary: Search server-authorized tariffs
      operationId: getTariffs
      parameters:
        - { $ref: "#/components/parameters/TariffSearch" }
        - name: tariff_group_id
          in: query
          schema: { type: string }
        - name: cr_num
          in: query
          required: true
          schema: { type: string }
        - name: workflow_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tariffs with server prices
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Tariff" }
        default: { $ref: "#/components/responses/Error" }
  /payment-options:
    get:
      summary: Load allowed payment modes, card types and POS terminals
      operationId: getPaymentOptions
      parameters:
        - name: cr_num
          in: query
          schema: { type: string }
        - name: category_name
          in: query
          schema: { type: string }
        - name: hospital_service_id
          in: query
          schema: { type: string }
        - name: billing_service_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Counter and patient-context payment options
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/PaymentOptions" }
        default: { $ref: "#/components/responses/Error" }
  /eligibility:
    post:
      summary: Validate patient, request and workflow eligibility
      operationId: checkEligibility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EligibilityCommand" }
      responses:
        "200":
          description: Eligibility and authoritative workflow context
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/EligibilityResult" }
        default: { $ref: "#/components/responses/Error" }
  /terminal-payments:
    post:
      summary: Initiate Card or UPI collection on a POS terminal
      operationId: initiateTerminalPayment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalPaymentCommand" }
      responses:
        "200":
          description: Pending terminal transaction
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/TerminalPayment" }
        default: { $ref: "#/components/responses/Error" }
  /terminal-payments/{terminal_transaction_id}:
    get:
      summary: Poll POS transaction status
      operationId: getTerminalPaymentStatus
      parameters:
        - name: terminal_transaction_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current terminal state
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SuccessEnvelope" }
                  - properties:
                      data: { $ref: "#/components/schemas/TerminalPayment" }
        default: { $ref: "#/components/responses/Error" }
  /transactions:
    get:
      summary: List counter-scoped transactions with server pagination
      operationId: listTransactions
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
        - name: transaction_from_date
          in: query
          schema: { type: string, format: date }
        - name: transaction_to_date
          in: query
          schema: { type: string, format: date }
        - name: payment_mode
          in: query
          schema: { type: string }
        - name: transaction_status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Transaction page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionPageEnvelope" }
        default: { $ref: "#/components/responses/Error" }
    post:
      summary: Atomically post a collection, refund or estimate
      operationId: postTransaction
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionCommand" }
      responses:
        "200":
          description: Existing result for a replayed idempotency key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostedTransactionEnvelope" }
        "201":
          description: Transaction posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostedTransactionEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /shifts/current/close-preparation:
    get:
      summary: Prepare the authenticated counter shift for cash reconciliation
      description: >-
        Re-reads the current shift, authoritative cash amount, close blockers
        and enabled denomination master. No state is changed.
      operationId: prepareShiftClose
      responses:
        "200":
          description: Current close preparation and concurrency version
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ShiftClosePreparationEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /shifts/{shift_id}/close:
    post:
      summary: Revalidate and atomically close the authenticated counter shift
      operationId: closeShift
      parameters:
        - name: shift_id
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShiftCloseCommand" }
      responses:
        "200":
          description: Existing or newly closed shift result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClosedShiftEnvelope" }
        default: { $ref: "#/components/responses/Error" }
  /shifts/{shift_id}/reopen:
    post:
      summary: Start another shift segment for the same counter and business date
      description: >-
        Preserves prior submitted cash and denomination totals for the next
        cumulative day-end submission.
      operationId: reopenShift
      parameters:
        - name: shift_id
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shift_version]
              properties:
                shift_version: { type: string }
              additionalProperties: false
      responses:
        "200":
          description: Existing result for a safely replayed request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenShiftEnvelope" }
        "201":
          description: New same-day shift segment opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenShiftEnvelope" }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    PatientSearch:
      { name: pat_search, in: query, schema: { type: string, maxLength: 100 } }
    RequestSearch:
      { name: req_search, in: query, schema: { type: string, maxLength: 100 } }
    HospitalServiceName:
      name: hospital_service_name
      in: query
      description: Exact match on the row's hospital service (OPD / IPD / Emergency).
      schema: { $ref: "#/components/schemas/HospitalServiceName" }
    RequestType:
      name: req_type
      in: query
      description: "Exact match on the row's request type (Service, Final Adjustment, ...)."
      schema: { $ref: "#/components/schemas/RequestTypeName" }
    TariffSearch:
      {
        name: tariff_search,
        in: query,
        schema: { type: string, maxLength: 100 },
      }
    Page:
      {
        name: page,
        in: query,
        schema: { type: integer, minimum: 0, default: 0 },
      }
    Size:
      {
        name: size,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 100, default: 10 },
      }
  responses:
    Error:
      description: Validation, authorization, conflict or server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data, trace_id]
      properties:
        success: { type: boolean, enum: [true] }
        data: {}
        trace_id: { type: string }
    ErrorEnvelope:
      type: object
      required: [success, error, trace_id]
      properties:
        success: { type: boolean, enum: [false] }
        trace_id: { type: string }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fieldErrors:
              type: object
              additionalProperties: { type: string }
    Page:
      type: object
      required: [items, total, page, size]
      properties:
        items: { type: array, items: {} }
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }
    BootstrapEnvelope:
      allOf:
        - { $ref: "#/components/schemas/SuccessEnvelope" }
        - properties:
            data:
              type: object
              required:
                [
                  business_date,
                  facility_details,
                  hospital_services,
                  billing_services_by_hospital_service,
                  payment_options,
                  pending_queue_summary,
                  request_filter_options,
                ]
              properties:
                business_date: { type: string, format: date }
                facility_details:
                  type: object
                  required: [facility_name]
                  properties:
                    facility_name: { type: string }
                    facility_subtitle: { type: string }
                hospital_services:
                  {
                    type: array,
                    items: { $ref: "#/components/schemas/HospitalServiceName" },
                  }
                billing_services_by_hospital_service:
                  { type: object, additionalProperties: true }
                payment_options: { $ref: "#/components/schemas/PaymentOptions" }
                pending_queue_summary:
                  type: object
                  required:
                    [
                      pending_request_count,
                      today_pending_request_count,
                      cash_in_drawer_amount,
                    ]
                  properties:
                    pending_request_count: { type: integer, format: int64 }
                    today_pending_request_count:
                      { type: integer, format: int64 }
                    cash_in_drawer_amount:
                      {
                        type: string,
                        description: Same-day cash-payment collections minus cash-payment refunds,
                      }
                request_filter_options:
                  type: object
                  required:
                    [hospital_service_names, req_types, department_names]
                  properties:
                    hospital_service_names:
                      {
                        type: array,
                        items:
                          { $ref: "#/components/schemas/HospitalServiceName" },
                      }
                    req_types:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/RequestTypeName" },
                      }
                    department_names: { type: array, items: { type: string } }
                patient_seed_list:
                  {
                    type: array,
                    items: { $ref: "#/components/schemas/Patient" },
                  }
                pending_request_queue:
                  {
                    type: array,
                    items: { $ref: "#/components/schemas/PendingRequestRow" },
                  }
                tariff_group_names: { type: array, items: { type: string } }
                tariff_catalog:
                  {
                    type: array,
                    items: { $ref: "#/components/schemas/Tariff" },
                  }
                collection_mode_options:
                  {
                    type: array,
                    items: { type: object, additionalProperties: true },
                  }
                recent_transaction_rows:
                  {
                    type: array,
                    items: { $ref: "#/components/schemas/Transaction" },
                  }
                recent_estimate_rows:
                  {
                    type: array,
                    items: { type: object, additionalProperties: true },
                  }
    Patient:
      type: object
      required: [cr_num, pat_name]
      properties:
        cr_num: { type: string }
        pat_name: { type: string }
        pat_age: { type: integer }
        pat_sex: { type: string }
        ipd_admission_num: { type: string }
        account_num: { type: string }
        episode_name: { type: string }
        admission_status: { type: string }
        department_name: { type: string }
        unit_name: { type: string }
        ward_name: { type: string }
        bed_name: { type: string }
        room_type_name: { type: string }
        consultant_name: { type: string }
        admitted_on: { type: string, format: date }
        category_name: { type: string }
        mobile_num: { type: string }
        abha_num: { type: string }
        abha_address: { type: string }
        eligible_charge_type_ids: { type: array, items: { type: string } }
        ipd_account_open: { type: boolean }
        refundable_document_count: { type: integer }
        workflow_context: { type: object, additionalProperties: true }
      additionalProperties: true
    PatientTile:
      type: object
      required:
        [cr_num, ipd_admission_num, pat_name, pat_age, pat_sex, category_name]
      properties:
        cr_num: { type: string }
        ipd_admission_num:
          {
            type: string,
            description: Admission number for IPD or '-' for OPD.,
          }
        pat_name: { type: string }
        pat_age: { type: integer }
        pat_sex: { type: string }
        category_name: { type: string }
        patient_category_code: { type: string }
        mobile_num: { type: string }
        abha_num: { type: string }
        abha_address: { type: string }
        guardian_name: { type: string }
    HospitalService:
      type: object
      required:
        [
          hospital_service_id,
          legacy_charge_type_id,
          hospital_service_name,
          hospital_service_short_name,
          hospital_service_title,
          hospital_service_description,
          display_tone,
          icon_name,
        ]
      properties:
        hospital_service_id: { type: string }
        legacy_charge_type_id: { type: string }
        hospital_service_name: { type: string }
        hospital_service_short_name: { type: string }
        hospital_service_title: { type: string }
        hospital_service_description: { type: string }
        display_tone: { type: string }
        icon_name: { type: string }
    BillingService:
      type: object
      required:
        [
          billing_service_id,
          billing_service_name,
          processing_billing_service_id,
          workflow_family,
          legacy_mode,
        ]
      properties:
        billing_service_id: { type: string }
        billing_service_name: { type: string }
        processing_billing_service_id: { type: string }
        workflow_family: { type: string }
        legacy_mode: { type: string }
    PendingRequestRow:
      type: object
      required:
        [
          req_no,
          req_version,
          req_date,
          pat_name,
          department_name,
          category_name,
          cr_num,
          hospital_service_name,
          req_type,
          req_amount,
        ]
      properties:
        req_no:
          {
            type: string,
            description: Unique request number used to open the request,
          }
        req_date:
          {
            type: string,
            pattern: '^\d{2}/\d{2}/\d{4}$',
            example: "09/09/2026",
          }
        pat_name: { type: string }
        department_name: { type: string }
        category_name: { type: string }
        cr_num: { type: string }
        hospital_service_name:
          { $ref: "#/components/schemas/HospitalServiceName" }
        req_type: { $ref: "#/components/schemas/RequestTypeName" }
        req_amount:
          {
            type: string,
            example: "480.00",
            description: Decimal amount without currency symbol,
          }
        req_version: { type: string, description: Opaque concurrency version }
    HospitalServiceName:
      type: string
      description: >-
        The hospital service a request or transaction belongs to — the HBIMS
        charge-type family (sblnum_chargetype_id 1/4 → OPD, 2 → IPD,
        3 → Emergency). Shown as the queue's "Hospital Service" column.
      enum: [OPD, IPD, Emergency]
    RequestTypeName:
      type: string
      description: >-
        The request's kind within the queue, independent of hospital service.
        Shown as the queue's "Request Type" column. Not the Receipt / Refund /
        Estimation `request_type` used on collection commands. "Part Payment"
        never arrives as a queue request.
      enum:
        [
          Service,
          Refund,
          Advance Deposit,
          Advance Refund,
          Final Adjustment,
          Investigation Charges,
          Package Collection,
        ]
    PendingRequestMetrics:
      type: object
      required: [pending_request_total, req_type_buckets]
      properties:
        pending_request_total: { type: integer, format: int64 }
        req_type_buckets:
          type: array
          description: One bucket per (hospital_service_name, req_type) pair.
          items:
            type: object
            required: [hospital_service_name, req_type, pending_request_count]
            properties:
              hospital_service_name:
                { $ref: "#/components/schemas/HospitalServiceName" }
              req_type: { $ref: "#/components/schemas/RequestTypeName" }
              pending_request_count: { type: integer, format: int64 }
    DashboardEnvelope:
      allOf:
        - { $ref: "#/components/schemas/SuccessEnvelope" }
        - properties:
            data: { $ref: "#/components/schemas/DashboardSnapshot" }
    DashboardSnapshot:
      type: object
      required:
        [
          dashboard_business_date,
          dashboard_version,
          dashboard_generated_at,
          dashboard_kpis,
          dashboard_breakdowns,
          hourly_collection_buckets,
          dashboard_recent_transaction_page,
        ]
      properties:
        dashboard_business_date: { type: string, format: date }
        dashboard_version:
          { type: string, description: Opaque dashboard/shift version }
        dashboard_generated_at: { type: string, format: date-time }
        dashboard_kpis:
          type: object
          required:
            [
              collection_total_amount,
              refund_total_amount,
              net_collection_amount,
              transaction_count,
              cash_in_drawer_amount,
              largest_collection_amount,
            ]
          properties:
            collection_total_amount: { type: string }
            refund_total_amount: { type: string }
            net_collection_amount: { type: string }
            transaction_count: { type: string }
            cash_in_drawer_amount:
              type: string
              description: Same-day cash-payment collections minus cash-payment refunds; dashboard filters do not change it.
            largest_collection_amount: { type: string }
        dashboard_breakdowns:
          type: object
          required:
            [
              payment_mode_buckets,
              category_buckets,
              department_buckets,
              req_type_buckets,
            ]
          properties:
            payment_mode_buckets:
              {
                type: array,
                items: { $ref: "#/components/schemas/DashboardBucket" },
              }
            category_buckets:
              {
                type: array,
                items: { $ref: "#/components/schemas/DashboardBucket" },
              }
            department_buckets:
              {
                type: array,
                items: { $ref: "#/components/schemas/DashboardBucket" },
              }
            req_type_buckets:
              type: array
              description: Grouped by the transaction row's req_type.
              items: { $ref: "#/components/schemas/DashboardBucket" }
        hourly_collection_buckets:
          type: array
          items:
            allOf:
              - { $ref: "#/components/schemas/DashboardBucket" }
              - type: object
                required: [collection_hour]
                properties:
                  collection_hour: { type: integer, minimum: 0, maximum: 23 }
        dashboard_recent_transaction_page: { $ref: "#/components/schemas/Page" }
    DashboardBucket:
      type: object
      required:
        [
          dashboard_bucket_id,
          dashboard_bucket_label,
          dashboard_bucket_amount,
          dashboard_bucket_count,
          dashboard_bucket_percentage,
        ]
      properties:
        dashboard_bucket_id: { type: string }
        dashboard_bucket_label: { type: string }
        dashboard_bucket_amount: { type: string }
        dashboard_bucket_count: { type: string }
        dashboard_bucket_percentage: { type: string }
    DenominationOption:
      type: object
      required:
        [
          denomination_code,
          denomination_kind,
          denomination_value,
          denomination_label,
        ]
      properties:
        denomination_code:
          { type: string, description: Server-owned stable denomination code }
        denomination_kind: { type: string, enum: [NOTE, COIN] }
        denomination_value: { type: string, pattern: '^\d+(\.\d{2})?$' }
        denomination_label: { type: string }
    ShiftBlocker:
      type: object
      required: [shift_blocker_code, shift_blocker_message]
      properties:
        shift_blocker_code: { type: string }
        shift_blocker_message: { type: string }
        shift_blocker_count: { type: string }
    ShiftClosePreparationEnvelope:
      allOf:
        - { $ref: "#/components/schemas/SuccessEnvelope" }
        - properties:
            data:
              type: object
              required:
                [
                  shift_id,
                  shift_version,
                  shift_business_date,
                  shift_status,
                  can_close_shift,
                  shift_blockers,
                  expected_cash_amount,
                  previous_submitted_cash_amount,
                  cumulative_expected_cash_amount,
                  shift_segment_number,
                  denomination_options,
                ]
              properties:
                shift_id: { type: string }
                shift_version:
                  { type: string, description: Opaque concurrency version }
                shift_business_date: { type: string, format: date }
                shift_status: { type: string, enum: [OPEN] }
                can_close_shift: { type: boolean }
                shift_blockers:
                  {
                    type: array,
                    items: { $ref: "#/components/schemas/ShiftBlocker" },
                  }
                expected_cash_amount:
                  { type: string, pattern: '^-?\d+\.\d{2}$' }
                previous_submitted_cash_amount:
                  { type: string, pattern: '^-?\d+\.\d{2}$' }
                cumulative_expected_cash_amount:
                  { type: string, pattern: '^-?\d+\.\d{2}$' }
                shift_segment_number: { type: string }
                denomination_options:
                  {
                    type: array,
                    items: { $ref: "#/components/schemas/DenominationOption" },
                  }
    ShiftCloseCommand:
      type: object
      required: [shift_version, reconciliation_mode, denomination_counts]
      properties:
        shift_version: { type: string }
        reconciliation_mode: { type: string, enum: [DENOMINATION, SKIPPED] }
        denomination_counts:
          type: array
          items:
            type: object
            required: [denomination_code, denomination_quantity]
            properties:
              denomination_code: { type: string }
              denomination_quantity:
                { type: integer, minimum: 0, maximum: 9999 }
      additionalProperties: false
    ClosedShiftEnvelope:
      allOf:
        - { $ref: "#/components/schemas/SuccessEnvelope" }
        - properties:
            data:
              type: object
              required:
                [
                  shift_id,
                  shift_version,
                  shift_status,
                  shift_business_date,
                  shift_closed_at,
                  expected_cash_amount,
                  reconciliation_mode,
                  cumulative_cash_amount,
                  shift_segment_number,
                  shift_summary_number,
                ]
              properties:
                shift_id: { type: string }
                shift_version:
                  {
                    type: string,
                    description: Opaque version required to reopen,
                  }
                shift_status: { type: string, enum: [CLOSED] }
                shift_business_date: { type: string, format: date }
                shift_closed_at: { type: string, format: date-time }
                expected_cash_amount: { type: string }
                counted_cash_amount: { type: string, nullable: true }
                reconciliation_mode:
                  { type: string, enum: [DENOMINATION, SKIPPED] }
                previous_submitted_cash_amount: { type: string }
                cumulative_cash_amount: { type: string }
                shift_segment_number: { type: string }
                shift_summary_number: { type: string }
    OpenShiftEnvelope:
      allOf:
        - { $ref: "#/components/schemas/SuccessEnvelope" }
        - properties:
            data:
              type: object
              required:
                [
                  shift_id,
                  shift_version,
                  shift_business_date,
                  shift_status,
                  shift_segment_number,
                  previous_submitted_cash_amount,
                ]
              properties:
                shift_id: { type: string }
                shift_version: { type: string }
                shift_business_date: { type: string, format: date }
                shift_status: { type: string, enum: [OPEN] }
                shift_segment_number: { type: string }
                previous_submitted_cash_amount: { type: string }
    BillingRequest:
      type: object
      required:
        [
          req_no,
          req_version,
          pat_name,
          cr_num,
          hospital_service_name,
          req_type,
          req_date,
          req_amount,
          department_name,
        ]
      properties:
        req_no: { type: string }
        req_version: { type: string, description: Opaque concurrency version }
        pat_name: { type: string }
        cr_num: { type: string }
        hospital_service_name:
          { $ref: "#/components/schemas/HospitalServiceName" }
        req_type: { $ref: "#/components/schemas/RequestTypeName" }
        req_date: { type: string, format: date }
        req_amount: { type: string }
        department_name: { type: string }
        category_name: { type: string }
      additionalProperties: true
    RequestDetail:
      allOf:
        - { $ref: "#/components/schemas/BillingRequest" }
      description: Request metadata only; patient tile and tariff details are separate endpoints.
    RequestTariffDetails:
      type: object
      required: [req_no, req_version, hospital_service_name, tariff_lines]
      properties:
        req_no: { type: string }
        req_version: { type: string }
        hospital_service_name:
          { $ref: "#/components/schemas/HospitalServiceName" }
        settlement_context:
          description: Present only for IPD Final Adjustment; absent for OPD.
          allOf:
            - { $ref: "#/components/schemas/IpdSettlementContext" }
        tariff_lines:
          description: >-
            Same flat shape for OPD and IPD. The frontend computes
            gross/discount/net per line and every total from this array
            itself — do not also return gross_amount/discount_amount/net_amount.
          type: array
          items: { $ref: "#/components/schemas/TariffLine" }
    IpdSettlementContext:
      description: >-
        Every value is an array because the frontend's firstContextValue()
        only reads array[0] — a bare string is silently ignored in favor of
        the patient's own fallback instead of erroring. HBIMS only ever
        populates one real value per array today. Field names intentionally
        don't match their displayed labels: room_type_names is shown as
        "Ward Type" and ward_names as "Ward Name" (apiWireMappers.js).
      type: object
      required:
        [
          raising_department_names,
          episode_names,
          patient_category_names,
          room_type_names,
          ward_names,
        ]
      properties:
        raising_department_names: { type: array, items: { type: string } }
        episode_names: { type: array, items: { type: string } }
        patient_category_names: { type: array, items: { type: string } }
        room_type_names: { type: array, items: { type: string } }
        ward_names: { type: array, items: { type: string } }
    RequestPageEnvelope:
      allOf:
        - { $ref: "#/components/schemas/SuccessEnvelope" }
        - properties:
            data:
              allOf:
                - { $ref: "#/components/schemas/Page" }
                - properties:
                    items:
                      {
                        type: array,
                        items:
                          { $ref: "#/components/schemas/PendingRequestRow" },
                      }
    Tariff:
      type: object
      required: [tariff_code, tariff_name, tariff_rate]
      properties:
        tariff_code: { type: string }
        tariff_name: { type: string }
        tariff_group_name: { type: string }
        tariff_rate: { type: number, minimum: 0 }
        tariff_source: { type: string }
    TariffLine:
      allOf:
        - { $ref: "#/components/schemas/Tariff" }
        - type: object
          required: [tariff_qty, tariff_discount_percent]
          properties:
            tariff_qty: { type: number, minimum: 0 }
            tariff_discount_percent: { type: number, minimum: 0, maximum: 100 }
    PaymentOptions:
      type: object
      required: [payment_modes, payment_card_types, payment_pos_terminals]
      properties:
        payment_modes: { type: array, items: { type: string } }
        payment_card_types: { type: array, items: { type: string } }
        payment_pos_terminals: { type: array, items: { type: string } }
        payment_restrictions_by_category:
          { type: object, additionalProperties: true }
    EligibilityCommand:
      type: object
      required:
        [
          collection_source,
          request_type,
          cr_num,
          hospital_service_id,
          charge_type_id,
          billing_service_id,
          processing_billing_service_id,
          workflow_id,
        ]
      properties:
        collection_source: { type: string, enum: [request, direct] }
        req_no: { type: string, nullable: true }
        req_version: { type: string, nullable: true }
        request_type: { type: string, enum: [Receipt, Refund, Estimation] }
        cr_num: { type: string }
        hospital_service_id: { type: string }
        charge_type_id: { type: string }
        billing_service_id: { type: string }
        processing_billing_service_id: { type: string }
        workflow_id: { type: string }
    EligibilityResult:
      type: object
      required: [is_eligible, eligibility_code]
      properties:
        is_eligible: { type: boolean }
        eligibility_code: { type: string }
        eligibility_message: { type: string }
        pat_context_version: { type: string }
        workflow_context: { type: object, additionalProperties: true }
    TerminalPaymentCommand:
      type: object
      required: [payment_mode, pos_terminal_id, payment_amount, cr_num]
      properties:
        payment_mode: { type: string, enum: [Card, UPI] }
        card_type: { type: string, nullable: true }
        pos_terminal_id: { type: string }
        payment_amount: { type: number, exclusiveMinimum: 0 }
        cr_num: { type: string }
        payment_description: { type: string, maxLength: 500 }
    TerminalPayment:
      type: object
      required: [terminal_transaction_id, transaction_status]
      properties:
        terminal_transaction_id: { type: string }
        transaction_status:
          {
            type: string,
            enum: [PENDING, APPROVED, DECLINED, FAILED, CANCELLED, EXPIRED],
          }
        terminal_poll_after_ms: { type: integer, default: 10000 }
        terminal_expires_in_seconds: { type: integer, default: 300 }
        payment_approval_code: { type: string }
        card_last_four: { type: string }
    PaymentDetails:
      type: object
      required: [payment_mode, payment_summary]
      properties:
        payment_mode: { type: string }
        payment_description: { type: string }
        payment_summary: { type: string }
        card_type: { type: string, nullable: true }
        pos_terminal_id: { type: string, nullable: true }
        terminal_payment:
          type: object
          properties:
            terminal_transaction_id: { type: string }
            transaction_status: { type: string }
            payment_approval_code: { type: string }
            card_last_four: { type: string }
        manual_payment_details:
          type: object
          properties:
            bank_name: { type: string }
            payment_reference: { type: string }
            card_last_four: { type: string }
            transaction_date: { type: string, format: date }
            card_type: { type: string }
            payment_summary: { type: string }
    TransactionTotals:
      type: object
      required: [gross_amount, discount_amount, net_amount]
      properties:
        gross_amount: { type: string }
        discount_amount: { type: string }
        net_amount: { type: string }
    PrintableData:
      type: object
      required:
        [
          transaction_document_no,
          transaction_document_type,
          transaction_document_date,
          patient_details,
          tariff_lines,
          payment_details,
          transaction_totals,
        ]
      properties:
        transaction_document_no: { type: string }
        transaction_document_type: { type: string }
        transaction_document_date: { type: string }
        patient_details: { $ref: "#/components/schemas/Patient" }
        tariff_lines:
          { type: array, items: { $ref: "#/components/schemas/TariffLine" } }
        payment_details: { $ref: "#/components/schemas/PaymentDetails" }
        transaction_totals: { $ref: "#/components/schemas/TransactionTotals" }
    TransactionCommand:
      type: object
      required:
        [
          collection_source,
          request_type,
          workflow_id,
          processing_billing_service_id,
          cr_num,
          pat_context_version,
          workflow_fields,
          tariff_lines,
          transaction_total,
          payment_details,
          idempotency_key,
        ]
      properties:
        collection_source: { type: string, enum: [request, direct] }
        req_no: { type: string, nullable: true }
        req_version: { type: string, nullable: true }
        request_type: { type: string, enum: [Receipt, Refund, Estimation] }
        workflow_id: { type: string }
        processing_billing_service_id: { type: string }
        cr_num: { type: string }
        pat_context_version: { type: string }
        workflow_fields: { type: object, additionalProperties: true }
        tariff_lines:
          { type: array, items: { $ref: "#/components/schemas/TariffLine" } }
        transaction_total: { type: string, pattern: '^\\d+\\.\\d{2}$' }
        payment_details: { $ref: "#/components/schemas/PaymentDetails" }
        idempotency_key: { type: string }
      additionalProperties: true
    PostedTransactionEnvelope:
      allOf:
        - { $ref: "#/components/schemas/SuccessEnvelope" }
        - properties:
            data:
              type: object
              required:
                [transaction_document_no, transaction_status, printable_data]
              properties:
                transaction_document_no: { type: string }
                transaction_status: { type: string }
                printable_data: { $ref: "#/components/schemas/PrintableData" }
                resolved_req_no: { type: string, nullable: true }
                dashboard_transaction_row:
                  { $ref: "#/components/schemas/Transaction", nullable: true }
    Transaction:
      type: object
      required:
        [
          transaction_no,
          pat_name,
          cr_num,
          transaction_date_iso,
          transaction_time,
          payment_mode,
          transaction_amount,
          transaction_status,
          department_name,
          category_name,
          req_type,
          hospital_service_name,
          billing_service_name,
        ]
      properties:
        transaction_no: { type: string }
        pat_name: { type: string }
        cr_num: { type: string }
        transaction_date_iso: { type: string, format: date }
        transaction_time: { type: string }
        payment_mode: { type: string }
        transaction_amount: { type: string }
        transaction_status:
          {
            type: string,
            description: "Completed | Refunded | Cancelled | Failed | Unposted",
          }
        department_name:
          { type: string, description: Raising department of the patient }
        category_name:
          { type: string, description: Patient category, e.g. General or CGHS }
        req_type:
          type: string
          description: >-
            The transaction's request type without the hospital-service
            prefix — a RequestTypeName value, or "Part Payment" for a
            direct-collection part payment.
        hospital_service_name:
          { $ref: "#/components/schemas/HospitalServiceName" }
        billing_service_name: { type: string }
      additionalProperties: true
    TransactionPageEnvelope:
      allOf:
        - { $ref: "#/components/schemas/SuccessEnvelope" }
        - properties:
            data:
              allOf:
                - { $ref: "#/components/schemas/Page" }
                - properties:
                    items:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/Transaction" },
                      }
